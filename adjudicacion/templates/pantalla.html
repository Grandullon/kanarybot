<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selección enfermería · Pantalla</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* ---- Tema claro, alto contraste, pensado para proyector ---- */
    :root {
      --verde: #1b8a3a;   --verde-bg: #e7f6ec;   --verde-bd: #8bd6a2;
      --rojo:  #c62828;   --rojo-bg:  #fdeaea;    --rojo-bd:  #eaa3a3;
      --azul:  #14406b;   --azul2: #1e5a96;
      --tinta: #16242e;   --suave: #5a6b78;       --linea: #d7dee5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #f4f7fa; color: var(--tinta); margin: 0;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    header.cab {
      background: linear-gradient(180deg,#ffffff 0%, #eef3f8 100%);
      border-bottom: 4px solid var(--azul);
      padding: 10px 26px 0; flex: 0 0 auto;
    }
    .cab .fila { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    header.cab .titulo { display:flex; flex-direction:column; }
    header.cab h1 { font-size: clamp(26px, 2.4vw, 40px); margin: 0; color: var(--azul); letter-spacing:.5px; }
    header.cab .sub { font-size: clamp(13px, 1vw, 16px); color: var(--suave); }
    .cab .relleno { flex: 1; }

    .contadores { display: flex; gap: 14px; }
    .cont {
      background: #fff; border: 1px solid var(--linea); border-radius: 12px;
      padding: 6px 20px; text-align: center; min-width: 130px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .cont .num { font-size: clamp(34px, 3.4vw, 56px); font-weight: 800; line-height: 1.05; }
    .cont .etq { font-size: clamp(12px,.95vw,15px); color: var(--suave); text-transform: uppercase; letter-spacing:.5px; }
    .cont.ofer .num { color: var(--azul); }
    .cont.adj  .num { color: var(--rojo); }
    .cont.pend .num { color: var(--verde); }
    .reloj { font-size: clamp(13px,1vw,16px); color: var(--suave); white-space: nowrap; text-align:right; }

    /* Barra de progreso global */
    .progreso { height: 8px; background: #e4e9ee; border-radius: 999px; margin: 8px 0 10px; overflow: hidden; }
    .progreso #barra { height: 100%; width: 0; background: linear-gradient(90deg, var(--rojo), #e06666); transition: width .5s ease; }

    /* ---- Lienzo: dos columnas que llenan el alto, cada una con su scroll ---- */
    .lienzo { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1.7fr 1fr; gap: 22px; padding: 14px 26px 18px; }
    @media (max-width: 1150px) { .lienzo { grid-template-columns: 1fr; } }
    .col { display: flex; flex-direction: column; min-height: 0; }
    h2.sec { font-size: clamp(18px, 1.7vw, 26px); margin: 0 0 10px; display:flex; align-items:center; gap:10px; flex: 0 0 auto; }
    h2.sec .punto { width: 16px; height: 16px; border-radius: 4px; display:inline-block; }
    h2.sec.left .punto { background: var(--verde); }
    h2.sec.right .punto { background: var(--rojo); }
    h2.sec .cuantos { font-size: 60%; color: var(--suave); font-weight: 600; }
    .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 4px; }

    /* ---- Tablón por ofertar: tarjetas en 2 columnas que fluyen ---- */
    #pendientes { column-count: 2; column-gap: 16px; }
    @media (max-width: 1500px) { #pendientes { column-count: 1; } }
    .centro {
      background: #fff; border: 1px solid var(--linea); border-radius: 14px;
      padding: 14px 16px; margin: 0 0 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
      break-inside: avoid; -webkit-column-break-inside: avoid;
    }
    .centro.agotado { opacity: .55; }
    .centro .cabc { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .centro .nomc { font-size: clamp(19px, 1.7vw, 26px); font-weight: 800; color: var(--azul); text-transform: uppercase; }
    .quedan-grande {
      font-size: 17px; font-weight: 800; color: var(--verde);
      background: var(--verde-bg); border: 1px solid var(--verde-bd);
      border-radius: 999px; padding: 4px 16px; white-space: nowrap;
    }
    .quedan-grande b { font-size: clamp(20px,1.8vw,26px); }
    .quedan-grande.cero { color: var(--suave); background:#f1f3f5; border-color: var(--linea); }

    .tipo { padding: 8px 0; border-top: 1px dashed var(--linea); }
    .tipo .lin1 { display:flex; align-items:baseline; gap:10px; }
    .tipo .durh { font-weight: 800; font-size: clamp(16px,1.5vw,21px); color: var(--tinta); }
    .tipo .cuenta { margin-left:auto; font-size: clamp(14px,1.1vw,16px); color: var(--suave); white-space: nowrap; }
    .tipo .cuenta b { color: var(--verde); font-size: clamp(17px,1.5vw,21px); }
    .tipo .det { color: var(--suave); font-size: clamp(13px,1vw,15px); margin: 2px 0 6px; }
    .urgente { background: #fff3e0; color: #b35400; border: 1px solid #f0b878; border-radius: 999px;
      padding: 1px 10px; font-size: 13px; font-weight: 800; white-space: nowrap; animation: pulso 1.2s ease-in-out infinite; }
    @keyframes pulso { 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
    .barra-tipo { display:flex; height: 12px; border-radius: 999px; overflow:hidden; background:#eef1f4; }
    .barra-tipo .seg { display:block; }
    .barra-tipo .seg.libre { background: var(--verde); }
    .barra-tipo .seg.dada  { background: var(--rojo-bd); }
    .quedan-grande.urge { color:#b35400; background:#fff3e0; border-color:#f0b878; animation: pulso 1.2s ease-in-out infinite; }

    /* ---- Banner del último cogido ---- */
    #ultimo { flex: 0 0 auto; }
    .hero { background: linear-gradient(180deg,#fff 0%, #fdeaea 100%); border:2px solid var(--rojo-bd);
      border-radius:14px; padding:12px 16px; margin-bottom:10px; }
    .hero.destacar { animation: heroflash 1.4s ease-out 1; }
    @keyframes heroflash { 0%{ box-shadow:0 0 0 0 rgba(198,40,40,.5); } 100%{ box-shadow:0 0 0 14px rgba(198,40,40,0); } }
    .hero-tag { font-size: clamp(12px,1vw,14px); color: var(--rojo); font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .hero-cuerpo { display:flex; align-items:baseline; gap:12px; margin:2px 0; }
    .hero-nc { font-weight:800; color:var(--rojo); font-size: clamp(20px,2vw,30px); }
    .hero-nom { font-weight:800; font-size: clamp(22px,2.3vw,34px); }
    .hero-contr { color: var(--suave); font-size: clamp(14px,1.1vw,17px); }

    /* ---- Contadores por centro ---- */
    .chips { flex: 0 0 auto; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .chip { background:#fff; border:1px solid var(--linea); border-radius:999px; padding:3px 12px;
      font-size: clamp(12px,1vw,15px); color: var(--azul); }
    .chip b { color: var(--rojo); margin-left:2px; }

    .hero-fechas { font-size: clamp(13px,1.05vw,16px); color: var(--suave); margin-top: 2px; }

    /* ---- Feed de adjudicados ---- */
    .feed { background:#fff; border:1px solid var(--linea); border-radius:14px; }
    .item { display:flex; flex-direction:column; padding:12px 16px; border-bottom:1px solid var(--linea); }
    .item:last-child { border-bottom:0; }
    .item.nuevo { background: var(--verde-bg); animation: destello 1.6s ease-out 1; }
    @keyframes destello { 0%{ background:#bdebcb; } 100%{ background: var(--verde-bg); } }
    .item-top { display:flex; align-items:baseline; gap:10px; }
    .item .seq { color: var(--suave); font-weight:800; font-size:14px; }
    .item .nc { font-weight:800; color: var(--rojo); font-size: clamp(16px,1.4vw,19px); }
    .item .nom { flex:1; font-size: clamp(18px,1.6vw,24px); font-weight:800; }
    .item .hora { font-variant-numeric: tabular-nums; color: var(--suave); font-size:15px; margin-left:auto; }
    .campos { display:grid; grid-template-columns:max-content 1fr; column-gap:14px; row-gap:3px; margin-top:7px; padding-left:2px; }
    .campos .rotulo { color: var(--suave); font-size: clamp(11px,.9vw,13px); text-transform:uppercase; letter-spacing:.5px; align-self:center; }
    .campos .valor { font-size: clamp(15px,1.2vw,18px); font-weight:600; color: var(--tinta); }
    .campos .valor.centro { color: var(--azul); font-weight:800; text-transform:uppercase; font-size: clamp(16px,1.4vw,20px); }

    .vacio { color: var(--suave); font-size: 19px; padding: 18px; text-align:center; }
  </style>
</head>
<body>
  <header class="cab">
    <div class="fila">
      <div class="titulo">
        <h1>Selección enfermería</h1>
        <span class="sub">Adjudicación de contratos · Granada</span>
      </div>
      <div class="relleno"></div>
      <div class="contadores">
        <div class="cont ofer"><div class="num" id="c-total">0</div><div class="etq">Ofertados</div></div>
        <div class="cont adj"><div class="num" id="c-asig">0</div><div class="etq">Adjudicados</div></div>
        <div class="cont pend"><div class="num" id="c-pend">0</div><div class="etq">Por ofertar</div></div>
      </div>
      <div class="reloj">Actualizado<br><span id="hora">—</span></div>
    </div>
    <div class="progreso"><div id="barra"></div></div>
  </header>

  <div class="lienzo">
    <div class="col">
      <h2 class="sec left"><span class="punto"></span>Puestos por ofertar</h2>
      <div class="scroll"><div id="pendientes"></div></div>
    </div>
    <div class="col">
      <h2 class="sec right"><span class="punto"></span>Se va cogiendo <span class="cuantos" id="cuantos"></span></h2>
      <div id="ultimo"></div>
      <div class="chips" id="porcentro"></div>
      <div class="scroll"><div class="feed" id="adjudicados"></div></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='pantalla.js') }}"></script>
</body>
</html>
