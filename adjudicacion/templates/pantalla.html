<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adjudicación · Pantalla</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { background: #0f2138; color: #fff; }
    header.barra { background: #0b1a2c; }
    header.barra h1 { font-size: 26px; }
    .contador { background: #16304f; border-color: #244a73; color: #fff; min-width: 150px; }
    .contador .num { font-size: 46px; }
    .contador .etq { color: #9fc3e8; font-size: 14px; }
    .contador.ok .num { color: #7ee08a; }
    .contador.pend .num { color: #ffd27d; }
    .panel-pantalla { padding: 16px 26px; display: grid; grid-template-columns: 3fr 2fr; gap: 26px; }
    @media (max-width: 1100px) { .panel-pantalla { grid-template-columns: 1fr; } }
    h2.seccion { font-size: 24px; margin: 4px 0 10px; }
    h2.seccion.pend { color: #ffd27d; }
    h2.seccion.adj { color: #7ee08a; }
    table { background: transparent; }
    th { background: #16304f; color: #9fc3e8; font-size: 16px; border-color: #244a73; }
    td { color: #eaf2fb; font-size: 19px; border-color: #1d3a5c; }
    tr.adj td b { color: #aef5b6; }
    .grupo { margin-bottom: 18px; }
    .grupo h3 { font-size: 20px; color: #cfe2ff; margin: 6px 0; display: flex; justify-content: space-between; border-bottom: 2px solid #244a73; padding-bottom: 4px; }
    .quedan { background: #ffd27d; color: #3a2c00; border-radius: 999px; padding: 1px 12px; font-size: 16px; font-weight: 700; }
    .pill { font-size: 15px; }
    .reloj { font-size: 16px; color: #9fc3e8; }
    .vacio { color: #9fc3e8; font-size: 18px; }
  </style>
</head>
<body>
  <header class="barra">
    <h1>Adjudicación de contratos</h1>
    <div class="contadores">
      <div class="contador"><div class="num" id="c-total">0</div><div class="etq">Ofertados</div></div>
      <div class="contador ok"><div class="num" id="c-asig">0</div><div class="etq">Adjudicados</div></div>
      <div class="contador pend"><div class="num" id="c-pend">0</div><div class="etq">Por ofertar</div></div>
    </div>
    <div class="relleno"></div>
    <span class="reloj">Actualizado: <span id="hora">—</span></span>
  </header>

  <div class="panel-pantalla">
    <div>
      <h2 class="seccion pend">📋 Puestos por ofertar</h2>
      <div id="pendientes"></div>
    </div>
    <div>
      <h2 class="seccion adj">✅ Adjudicados</h2>
      <div id="adjudicados"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='pantalla.js') }}"></script>
</body>
</html>
