<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adjudicación · Panel del operador</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="barra">
    <h1>Acto de adjudicación · Panel</h1>
    <div class="contadores">
      <div class="contador"><div class="num" id="c-total">0</div><div class="etq">Ofertados</div></div>
      <div class="contador ok"><div class="num" id="c-asig">0</div><div class="etq">Adjudicados</div></div>
      <div class="contador pend"><div class="num" id="c-pend">0</div><div class="etq">Por ofertar</div></div>
    </div>
    <div class="relleno"></div>
    <a href="/pantalla" target="_blank">🖥️ Abrir pantalla de proyección</a>
    <a href="/config">⚙️ Configuración</a>
    <span class="mini">Actualizado: <span id="hora">—</span></span>
  </header>

  <div class="aviso" id="aviso"></div>

  <div class="contenido">
    <div class="tabs">
      <button id="tab-cand" class="tab activa" onclick="cambiarVista('cand')">👤 Por candidato</button>
      <button id="tab-centro" class="tab" onclick="cambiarVista('centro')">🏥 Por centro</button>
      <div class="relleno"></div>
      <button class="sec" id="btn-imp-centros" onclick="imprimirTodosCentros()" style="display:none">🖨️ Imprimir todos los centros</button>
    </div>

    <div class="controles">
      <input type="search" id="filtro" placeholder="Buscar candidato (nº, nombre o DNI…)" style="flex:1; min-width:260px">
      <select id="filtro-cestado">
        <option value="">Todos los candidatos</option>
        <option value="__sin">Sin asignar</option>
        <option value="__asig">Asignados</option>
      </select>
      <span class="mini" id="cand-cuenta" style="align-self:center"></span>
    </div>

    <div id="vista-cand">
      <div class="tabla-envoltura">
        <table>
          <thead>
            <tr>
              <th style="width:60px">Nº</th>
              <th>Candidato</th>
              <th style="width:130px">DNI</th>
              <th style="width:70px">Puntos</th>
              <th>Contrato asignado</th>
              <th style="width:250px">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
    </div>

    <div id="vista-centro" style="display:none">
      <div id="centros" class="centros-cont"></div>
    </div>
  </div>

  <!-- Modal: selector de contrato para el candidato elegido -->
  <div class="fondo-modal" id="modal-fondo">
    <div class="modal modal-ancho">
      <h2 id="modal-titulo">Asignar contrato</h2>
      <div class="controles" style="margin:0 0 10px">
        <input type="search" id="m-busca" placeholder="Buscar contrato (centro, fechas, turno…)" style="flex:1; min-width:200px" autocomplete="off">
        <select id="m-centro"><option value="">Todos los centros</option></select>
        <select id="m-dias"><option value="">Todos los días</option></select>
        <select id="m-fini"><option value="">Cualquier inicio</option></select>
        <select id="m-disp">
          <option value="__libres">Solo libres</option>
          <option value="">Todos</option>
        </select>
      </div>
      <div id="m-lista" class="lista-contratos"></div>
      <div class="campo">
        <label>Estado</label>
        <select id="modal-estado"></select>
      </div>
      <div class="acciones">
        <button class="sec" id="modal-cancelar">Cancelar</button>
        <button id="modal-aceptar" disabled>Asignar contrato</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='operador.js') }}"></script>
</body>
</html>
